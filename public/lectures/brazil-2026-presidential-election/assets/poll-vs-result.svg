  <text x="78" y="465" fill="#f8fafc" font-family="system-ui" font-size="18" font-weight="700">Interpret carefully</text>
  <text x="78" y="497" fill="#cbd5e1" font-family="system-ui" font-size="15">The poll measured a sample before voting; the result counted ballots. A small lead in a poll</text>
  <text x="78" y="521" fill="#cbd5e1" font-family="system-ui" font-size="15">does not guarantee the winner—sampling error, turnout and late decisions all matter.</text>
  <text x="54" y="590" fill="#64748b" font-family="system-ui" font-size="12">Sources: AtlasIntel/Bloomberg report (18–23 Oct); TSE final count (25 Oct 2026).</text>
